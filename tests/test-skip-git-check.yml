name: Test skip git check with valid HTML
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          root: tests/fixtures/valid
          skip_git_check: "true"
          log_level: WARNING
      - name: Assert result is 0 (success with skip_git_check)
        env:
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "result: $RESULT"
          if [ "$RESULT" != "0" ]; then
            echo "FAIL: expected result '0' but got '$RESULT'"
            exit 1
          fi
          echo "PASS"
