name: Test error when no root or config provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          skip_git_check: "true"
        continue-on-error: true
      - name: Assert action failed due to missing input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no root or config given, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no root or config provided"
