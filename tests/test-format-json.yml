name: Test JSON format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create valid HTML file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/html-json"
          cat > "$GITHUB_WORKSPACE/html-json/index.html" << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8">
              <title>JSON Format Test</title>
            </head>
            <body>
              <h1>Format Test</h1>
            </body>
          </html>
          EOF
      - id: action
        uses: .
        with:
          root: ${{ github.workspace }}/html-json
          format: json
          log_level: WARNING
      - name: Assert result is success with JSON format
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected exit code 0 for valid HTML with JSON format, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
