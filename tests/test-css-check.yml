name: Test CSS checking enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          root: tests/fixtures/with-css
          css: "true"
          log_level: WARNING
      - name: Assert result is success with CSS checking
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected result '0' (success) but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
