name: Test invalid HTML validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          root: tests/fixtures/invalid
          log_level: WARNING
          skip_git_check: "true"
        continue-on-error: true
      - name: Assert result is failure
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual result: $ACTUAL"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid HTML but outcome was '$OUTCOME'"
            exit 1
          fi
          if [ "$ACTUAL" = "0" ]; then
            echo "FAIL: expected non-zero result for invalid HTML but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: invalid HTML correctly detected"
