name: Test invalid HTML detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          root: tests/fixtures/invalid
          log_level: WARNING
        continue-on-error: true
      - name: Assert result is failure (non-zero exit code)
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual result: $ACTUAL"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on invalid HTML but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly detected invalid HTML"
