name: Test invalid HTML5 validation fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          root: ./tests/fixtures/invalid
          log_level: WARNING
        continue-on-error: true
      - name: Assert action failed with non-zero result
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid HTML but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid HTML"
