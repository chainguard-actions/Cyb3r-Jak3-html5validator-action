name: Test invalid HTML detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          root: tests/fixtures/invalid
          log_level: WARNING
      - name: Assert action failed due to invalid HTML
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.result }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on invalid HTML but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid HTML"
