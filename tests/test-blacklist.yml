name: Test blacklist feature to ignore invalid HTML directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          root: tests/fixtures
          blacklist: invalid
          log_level: WARNING
          skip_git_check: "true"
      - name: Assert result is success when invalid dir is blacklisted
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected result '0' (success) when invalid dir is blacklisted but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
