name: Test basic valid HTML5
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create valid HTML file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/html-test"
          cat > "$GITHUB_WORKSPACE/html-test/index.html" << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8">
              <title>Test Page</title>
            </head>
            <body>
              <h1>Hello World</h1>
              <p>This is a valid HTML5 page.</p>
            </body>
          </html>
          EOF
      - id: action
        uses: .
        with:
          root: ${{ github.workspace }}/html-test
          log_level: WARNING
      - name: Assert result is success
        env:
          ACTUAL: ${{ steps.action.outputs.result }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected exit code 0 for valid HTML, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
